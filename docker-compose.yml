version: '3.8'

services:
  # 1. PostgreSQL (Loglar ve Doküman Takibi İçin - Senin Tercihin Korundu)
  postgres:
    image: postgres:15
    container_name: bddk_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: rag_logs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Etcd (Referans projedeki versiyon ve healthcheck korumaları eklendi)
  milvus-etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_RETENTION=1
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. RustFS (Referans projedeki güncel beta sürümü ve detaylı konfigürasyonları eklendi)
  rustfs:
    container_name: rustfs
    image: rustfs/rustfs:1.0.0-beta.11
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_REGION=us-east-1
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - TZ=Europe/Istanbul
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

  # 4. Milvus Standalone (Referans projedeki güncel v2.4.0 sürüme çekildi)
  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: rustfs:9000
      MINIO_ACCESS_KEY_ID: rustfsadmin
      MINIO_SECRET_ACCESS_KEY: rustfsadmin
      MINIO_BUCKET_NAME: milvus-data
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      milvus-etcd:
        condition: service_healthy
      rustfs:
        condition: service_started

  # 5. Attu (Milvus Görsel Arayüzü, v2.4.0 uyumlu hale getirildi)
  attu:
    container_name: attu
    image: zilliz/attu:v2.4.0
    ports:
      - "8001:3000"
    environment:
      - MILVUS_URL=milvus-standalone:19530
    depends_on:
      - milvus-standalone

volumes:
  postgres_data:
  etcd-data:
  rustfs-data:
  milvus-data: