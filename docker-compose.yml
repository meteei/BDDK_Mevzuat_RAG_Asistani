version: '3.8'

services:
  # 1. PostgreSQL (Loglar ve Geri Bildirimler için)
  postgres:
    image: postgres:15
    container_name: bddk_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: rag_logs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Etcd (Milvus'un metadata ve koordinasyon yöneticisi)
  etcd:
    container_name: bddk_milvus_etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://12.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  # 3. RustFS (Milvus'un Yeni Nesil S3 Uyumlu Nesne Depolama Motoru)
  rustfs:
    container_name: bddk_rustfs_storage
    image: rustfs/rustfs:latest
    environment:
      - RUSTFS_ACCESS_KEY=minioadmin
      - RUSTFS_SECRET_KEY=minioadmin
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data

  # 4. Milvus (Vektör Veritabanı)
  standalone:
    container_name: bddk_milvus
    image: milvusdb/milvus:v2.3.1
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: rustfs:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "rustfs"

  # 5. Attu (Milvus Görsel Yönetim Paneli)
  attu:
    container_name: bddk_attu
    image: zilliz/attu:v2.3.1
    environment:
      MILVUS_URL: standalone:19530
    ports:
      - "8000:3000"
    depends_on:
      - "standalone"

volumes:
  postgres_data:
  etcd_data:
  rustfs_data:
  milvus_data: